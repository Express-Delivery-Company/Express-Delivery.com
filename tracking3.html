<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Live Tracking | Express Delivery</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body class="tracking-page">

<header class="nav">
  <div class="container nav-inner">
    <a class="brand" href="index.html"><img class="brand-logo" src="assets/express-delivery-logo.png" alt="Express Delivery logo" /></a>
    <div class="nav-cta">
      <a class="btn ghost" href="track.html">Back</a>
      <a class="btn primary" href="ship.html">Ship Now</a>
    </div>
  </div>
</header>

<main>
  <section class="pagehead">
    <div class="container">
      <h1>Live Shipment Tracking</h1>
      <p>Map view, shipment summary, route history, and current location.</p>
    </div>
  </section>

  <section class="section">
    <div class="container tracking-layout">

      <div class="mapWrap">
        <div id="map"></div>
      </div>

      <div class="side">
        <div class="infoCard">
          <h3>Shipment Summary</h3>
          <div class="kv" id="summaryKv"></div>
        </div>

        <div class="infoCard current-location-card">
          <span class="status-chip current-chip">Current package location</span>
          <div id="currentStop"></div>
        </div>

        <details class="infoCard route-history-card">
          <summary>
            <span>Route History</span>
            <b>Expand</b>
          </summary>
          <div class="timeline" id="timeline"></div>
        </details>
      </div>

    </div>
  </section>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="main.js"></script>
<script src="tracking.js"></script>
</body>
</html>
